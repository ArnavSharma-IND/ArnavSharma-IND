
name: Update Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=ArnavSharma-IND&theme=transparent&hide_border=true&background=0B1020&ring=75C9FF&fire=9B8CFF&currStreakLabel=75C9FF&sideLabels=DCE7F7&dates=91A4C2&currStreakNum=FFFFFF&sideNums=FFFFFF&disable_animations=true
          path: profile/streak.svg

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
